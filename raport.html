<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raport Mental - Database Santri PMDG Kampus 5 Darul Qiyam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-brand-row">
                    <h2>📚 Database Santri</h2>
                    <button class="sidebar-toggle" type="button" aria-label="Toggle menu">☰</button>
                </div>
                <span>PMDG Kampus 5 Darul Qiyam</span>
            </div>
            <nav class="sidebar-nav">
                <a href="overview.html" class="sidebar-link">📊 Overview</a>
                <a href="form.html" class="sidebar-link" data-admin-only>➕ Input Data</a>
                <a href="list.html" class="sidebar-link">📋 List Data</a>
                <a href="raport.html" class="sidebar-link active">📝 Raport Mental</a>
            </nav>
            <div class="sidebar-footer">
                <span class="nav-role" data-role-label></span>
                <a href="login.html" class="sidebar-link nav-logout" data-logout>Keluar</a>
            </div>
        </aside>
        <main class="main-content">
            <div class="content-wrap">
                <header class="page-header">
                    <h1>Raport Mental Santri</h1>
                    <p class="subtitle">Input nilai kepribadian bulanan per santri</p>
                </header>

                <section class="report-filter">
                    <div class="overview-card">
                        <div class="report-filter-grid">
                            <div class="form-group">
                                <label for="raport-month">Bulan Penilaian</label>
                                <input type="month" id="raport-month" required>
                            </div>
                            <div class="form-group">
                                <label for="filter-kelas">Kelas</label>
                                <select id="filter-kelas">
                                    <option value="">Semua Kelas</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="santri-select">Nama Santri</label>
                                <select id="santri-select" required>
                                    <option value="">Pilih Santri</option>
                                </select>
                            </div>
                        </div>
                        <div id="completion-summary" class="report-summary"></div>
                    </div>
                </section>

                <section class="report-status">
                    <div class="overview-card">
                        <div class="overview-header">
                            <h2>Status Pengisian Bulan Ini</h2>
                        </div>
                        <div class="table-container">
                            <table class="report-table">
                                <thead>
                                    <tr>
                                        <th>No</th>
                                        <th>Nama</th>
                                        <th>Kelas</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="report-tbody">
                                    <tr>
                                        <td colspan="4" class="empty-state">Belum ada data.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <section class="report-form-section">
                    <div class="overview-card">
                        <div class="overview-header">
                            <h2>Form Raport Mental</h2>
                            <span id="report-mode" class="overview-total"></span>
                        </div>
                        <form id="raport-form" class="report-form">
                            <div id="report-fields" class="report-grid"></div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary" id="raport-submit">Simpan Raport</button>
                            </div>
                        </form>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="db.js"></script>
    <script src="raport.js"></script>
</body>
</html>
